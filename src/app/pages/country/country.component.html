<app-header [titlePage]="titlePage"></app-header>
<div>
  <div>
    <div class="split">
      <div>
        <p>Number of entries</p>
        <p>{{ totalEntries }}</p>
      </div>
      <div>
        <p>Total Number of medals</p>
        <p>{{ totalMedals }}</p>
      </div>
      <div>
        <p>Total Number of athletes</p>
        <p>{{ totalAthletes }}</p>
      </div>
    </div>
  </div>
  
  <div class="chart-container">
    <canvas id="countryChart"></canvas>
  </div>
  <div class="center">
    <app-button label="Go back" link="/"></app-button>
  </div>
</div>
