<app-header [titlePage]="titlePage" [kpiList]="kpiList"></app-header>
<main class="center">
  <div>
    @switch (state) {
      @case ("loading") {
        <app-spinner></app-spinner>
      }

      @case ("empty") {
        <div class="alert alert-secondary">No Olympic data found</div>
      }

      @case ("error") {
        <app-error [error]="error"></app-error>
      }

      @case ("success") {
        <div>
          <app-country-chart [data]="data"></app-country-chart>
        </div>
      }
    }
  </div>
  <div>
    <app-button label="Back to home page" link="/"></app-button>
  </div>
</main>
