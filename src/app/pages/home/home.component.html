<app-header [titlePage]="titlePage" [kpiList]="kpiList"></app-header>
@switch (state) {
  @case ("loading") {
    <app-spinner></app-spinner>
  }

  @case ("empty") {
    <div class="center">
    <p>No data.</p></div>
  }

  @case ("error") {
    <app-error [error]="error"></app-error>
  }

  @case ("success") {
    <app-medals-chart
      [data]="data"
      (countryId)="onCountryId($event)"
    ></app-medals-chart>
  }
}
