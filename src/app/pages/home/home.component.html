<app-header [titlePage]="titlePage"></app-header>

@switch (state) {
  @case ('loading') {
    <p role="status">Loading...</p>
  }

  @case ('empty') {
    <p>No data.</p>
  }

  @case ('error') {
    <app-error [error] = "error"></app-error>
  }

  @case ('success') {
    <app-dashboard
      [kpiList]="kpiList"
      [data]="data"
      (countryId)="onCountryId($event)"
    ></app-dashboard>
  }
}
