<app-header [titlePage]="titlePage" [kpiList]="kpiList"></app-header>
<main class="center">
  @switch (state) {
    @case ("loading") {
      <app-spinner></app-spinner>
    }

    @case ("empty") {
        <p>No data.</p>
    }

    @case ("error") {
      <app-error [error]="error"></app-error>
    }

    @case ("success") {
      <app-medals-chart
        [data]="data"
        (countryId)="onCountryId($event)"
      ></app-medals-chart>
    }
  }
</main>
