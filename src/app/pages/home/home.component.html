<app-header
  [titlePage]="titlePage"
  [kpiList]="kpiList"
  [isHome]="true"
></app-header>
<main class="center">
  @switch (state) {
    @case ('loading') {
      <app-spinner></app-spinner>
    }

    @case ('empty') {
      <div class="alert alert-secondary">No Olympic data found</div>
    }

    @case ('error') {
      <app-error [error]="error"></app-error>
    }

    @case ('success') {
      <app-medals-chart
        [data]="data"
        (countryId)="onCountryId($event)"
      ></app-medals-chart>
    }
  }
</main>
